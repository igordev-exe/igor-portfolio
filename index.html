<style>
/* Temas */
:root, [data-theme="dark"]{
  --bg:#0d1117; --sidebar:#010409; --panel:#161b22; --gutter-bg:#0d1117;
  --border:#30363d; --border-dim:#21262d; --hover:rgba(255,255,255,.055);
  --text:#c9d1d9; --text-dim:#8b949e; --text-bright:#f0f6fc;
  --green:#3fb950; --cyan:#79c0ff; --yellow:#e3b341; --pink:#ff7b72;
  --purple:#d2a8ff; --orange:#ffa657; --blue:#58a6ff; --comment:#8b949e;
  --selection:#1f3242; --accent:#1f7a31; --accent-fg:#f0f6fc;
  --line-hl:rgba(255,255,255,.045); --line-hl-b:#282e36; --guide:#2a3038; --gutter-n:#7d8590;
  --br1:#ffd700; --br2:#da70d6; --br3:#179fff;
  --widget:#161b22; --widget-b:#30363d; --shadow:rgba(1,4,9,.7);
  --find:rgba(255,199,0,.28);
}
[data-theme="light"]{
  --bg:#ffffff; --sidebar:#f8f8f8; --panel:#f3f3f3; --gutter-bg:#ffffff;
  --border:#e5e5e5; --border-dim:#ececec; --hover:rgba(0,0,0,.05);
  --text:#3b3b3b; --text-dim:#6a6a6a; --text-bright:#000000;
  --green:#098658; --cyan:#0070c1; --yellow:#a31515; --pink:#af00db;
  --purple:#795e26; --orange:#001080; --blue:#0000ff; --comment:#008000;
  --selection:#e4e6f1; --accent:#005fb8; --accent-fg:#ffffff;
  --line-hl:rgba(0,0,0,.035); --line-hl-b:#e4e4e4; --guide:#d3d3d3; --gutter-n:#767676;
  --br1:#0431fa; --br2:#319331; --br3:#7b3814;
  --widget:#ffffff; --widget-b:#c8c8c8; --shadow:rgba(0,0,0,.16);
  --find:rgba(255,199,0,.55);
}
[data-theme="monokai"]{
  --bg:#272822; --sidebar:#1e1f1c; --panel:#272822; --gutter-bg:#272822;
  --border:#3e3d32; --border-dim:#34352c; --hover:rgba(255,255,255,.06);
  --text:#f8f8f2; --text-dim:#98927d; --text-bright:#ffffff;
  --green:#a6e22e; --cyan:#66d9ef; --yellow:#e6db74; --pink:#f92672;
  --purple:#ae81ff; --orange:#fd971f; --blue:#66d9ef; --comment:#75715e;
  --selection:#49483e; --accent:#75715e; --accent-fg:#f8f8f2;
  --line-hl:rgba(255,255,255,.04); --line-hl-b:#3e3d32; --guide:#3b3a32; --gutter-n:#98927d;
  --br1:#e6db74; --br2:#f92672; --br3:#66d9ef;
  --widget:#1e1f1c; --widget-b:#3e3d32; --shadow:rgba(0,0,0,.6);
  --find:rgba(255,224,84,.32);
}
:root{ --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; --sideW:228px; }

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:var(--mono);font-size:13px;line-height:1.5;-webkit-text-size-adjust:100%;
}
button,input{font-family:inherit;color:inherit}
:focus-visible{outline:1px solid var(--blue);outline-offset:-1px}
*{scrollbar-width:thin;scrollbar-color:var(--border) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--border);border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:var(--text-dim);background-clip:padding-box}
svg{display:block;flex-shrink:0}
[hidden]{display:none!important}
.only-sm{display:none}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

/* Só aparece quando o JavaScript está desligado ou falhou. */
.nojs{
  position:fixed;inset:0;z-index:200;overflow:auto;background:var(--bg);
  padding:40px 22px;font-size:14px;line-height:1.7;
}
.nojs .wrap{max-width:620px;margin:0 auto}
.nojs h1{font-size:22px;color:var(--text-bright);margin-bottom:4px}
.nojs h2{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin:26px 0 8px}
.nojs p{margin-bottom:8px}
.nojs ul{list-style:none}
.nojs li{padding:4px 0;border-bottom:1px solid var(--border-dim)}
.nojs a{color:var(--blue)}
.nojs .tip{color:var(--text-dim);font-size:12px;margin-top:26px}

.app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}

/* Title bar + menus */
.titlebar{
  height:32px;flex-shrink:0;background:var(--sidebar);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 10px;gap:4px;user-select:none;position:relative;z-index:60;
}
.traffic{display:flex;gap:8px;margin-right:10px}
.traffic i{width:11px;height:11px;border-radius:50%;display:block}
.menubar{display:flex;gap:0}
.menu-btn{
  background:none;border:none;cursor:pointer;font-size:12px;color:var(--text);
  padding:3px 8px;border-radius:4px;opacity:.85;
}
.menu-btn:hover,.menu-btn.open{background:var(--hover);opacity:1}
.win-title{
  position:absolute;left:50%;transform:translateX(-50%);font-size:12px;color:var(--text-dim);
  white-space:nowrap;pointer-events:none;
}
.titlebar .right{margin-left:auto;display:flex;gap:2px}
.icon-btn{
  background:none;border:none;cursor:pointer;color:var(--text-dim);
  padding:4px 6px;border-radius:4px;display:flex;align-items:center;
}
.icon-btn:hover{background:var(--hover);color:var(--text-bright)}
.icon-btn.on{color:var(--text-bright)}
.icon-btn.open{background:var(--hover);color:var(--text-bright)}

.dropdown{
  position:absolute;top:31px;min-width:250px;background:var(--widget);
  border:1px solid var(--widget-b);border-radius:5px;box-shadow:0 6px 22px var(--shadow);
  padding:4px 0;z-index:70;
}
.dd-item{
  display:flex;align-items:center;gap:12px;padding:4px 12px 4px 24px;font-size:12px;
  cursor:pointer;white-space:nowrap;color:var(--text);
}
.dd-item:hover{background:var(--accent);color:var(--accent-fg)}
.dd-item .key{margin-left:auto;opacity:.6;font-size:11px}
.dd-item.disabled{opacity:.38;pointer-events:none}
.dd-item .check{width:12px;margin-left:-16px;font-size:11px}
.dd-sep{height:1px;background:var(--widget-b);margin:4px 0}

/* Body */
.body{flex:1;display:flex;overflow:hidden;position:relative;min-height:0}

.activity{
  width:48px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;gap:0;z-index:30;
}
.act-btn{
  width:48px;height:48px;background:none;border:none;cursor:pointer;color:var(--text);
  display:flex;align-items:center;justify-content:center;
  border-left:2px solid transparent;opacity:.55;transition:opacity .12s;position:relative;
}
.act-btn:hover,.act-btn.active{opacity:1}
.act-btn.active{border-left-color:var(--text-bright)}
.act-btn .dot{
  position:absolute;bottom:9px;right:9px;min-width:15px;height:15px;border-radius:8px;
  background:var(--accent);color:var(--accent-fg);font-size:9px;line-height:15px;text-align:center;padding:0 3px;
}
.activity .grow{flex:1}

/* Sidebar */
.sidebar{
  width:var(--sideW);flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;position:relative;
}
.side-head{
  font-size:11px;font-weight:400;letter-spacing:.6px;text-transform:uppercase;color:var(--text-dim);
  padding:12px 20px 8px;user-select:none;display:flex;align-items:center;justify-content:space-between;
}
.side-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:14px}
.side-resize{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:ew-resize;z-index:20}
.side-resize:hover{background:var(--blue);opacity:.5}
.section-title{
  font-size:11px;font-weight:600;letter-spacing:.3px;color:var(--text);
  padding:6px 12px 4px;user-select:none;display:flex;align-items:center;gap:4px;cursor:pointer;
}
.section-title .chev{transition:transform .1s}
.section-title.closed .chev{transform:rotate(-90deg)}
.tree-row{
  display:flex;align-items:center;gap:6px;padding:0 8px 0 0;height:22px;cursor:pointer;
  user-select:none;border-left:2px solid transparent;font-size:12.5px;color:var(--text);
  white-space:nowrap;
}
.tree-row:hover{background:var(--hover)}
.tree-row.active{background:var(--selection);border-left-color:var(--accent);color:var(--text-bright)}
.tree-row.static{cursor:default}
.tree-row.static:hover{background:none}
.tree-row .lbl{overflow:hidden;text-overflow:ellipsis}
.tree-row .sub{margin-left:auto;font-size:10.5px;color:var(--text-dim);padding-left:8px}
.tree-row .gitbadge{margin-left:auto;font-size:11px;font-weight:600;padding-left:8px}

/* Search panel */
.search-box{padding:4px 12px 8px;display:flex;flex-direction:column;gap:6px}
.search-input{
  background:var(--bg);border:1px solid var(--border);color:var(--text);
  font-size:12px;padding:4px 8px;outline:none;border-radius:2px;width:100%;
}
.search-input:focus{border-color:var(--blue)}
.search-meta{font-size:11px;color:var(--text-dim);padding:2px 12px 6px}
.res-file{
  display:flex;align-items:center;gap:6px;height:22px;padding:0 8px 0 10px;
  font-size:12px;color:var(--text);cursor:pointer;user-select:none;
}
.res-file:hover{background:var(--hover)}
.res-file .cnt{margin-left:auto;font-size:10px;background:var(--border);border-radius:9px;padding:0 6px;color:var(--text-dim)}
.res-line{
  display:flex;gap:8px;height:22px;padding:0 8px 0 30px;align-items:center;
  font-size:12px;color:var(--text-dim);cursor:pointer;white-space:pre;overflow:hidden;
}
.res-line:hover{background:var(--hover)}
.res-line mark{background:var(--find);color:var(--text-bright);border-radius:1px}
.empty-note{padding:10px 20px;font-size:12px;color:var(--text-dim);line-height:1.7}

/* Extensions panel */
.ext-card{display:flex;gap:10px;padding:9px 12px;cursor:default}
.ext-card:hover{background:var(--hover)}
.ext-ico{
  width:38px;height:38px;flex-shrink:0;border-radius:4px;display:flex;align-items:center;
  justify-content:center;font-size:14px;font-weight:700;color:#fff;
}
.ext-name{font-size:12.5px;color:var(--text-bright);display:flex;align-items:center;gap:6px}
.ext-desc{font-size:11px;color:var(--text-dim);line-height:1.45;margin-top:1px}
.ext-pub{font-size:10.5px;color:var(--text-dim);margin-top:3px;display:flex;align-items:center;gap:5px}

/* Editor */
.editor-col{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.tabbar{
  height:35px;flex-shrink:0;background:var(--sidebar);border-bottom:1px solid var(--border);
  display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;
}
.tabbar::-webkit-scrollbar{height:3px}
.tab{
  display:flex;align-items:center;gap:7px;padding:0 10px 0 12px;border:0;
  border-right:1px solid var(--border);border-top:1px solid transparent;
  background:none;cursor:pointer;font-size:12.5px;color:var(--text-dim);
  white-space:nowrap;flex-shrink:0;transition:color .1s,background .1s;
}
.tab:hover{background:var(--panel);color:var(--text)}
.tab.active{background:var(--bg);color:var(--text-bright);border-top-color:var(--accent)}
.tab.preview .name{font-style:italic}
.tab .name{max-width:180px;overflow:hidden;text-overflow:ellipsis}
.tab-close{
  opacity:0;width:18px;height:18px;border-radius:4px;display:flex;align-items:center;
  justify-content:center;color:var(--text-dim);margin-left:2px;
  background:none;border:0;padding:0;cursor:pointer;
}
.tab-close:hover{background:var(--hover);color:var(--text-bright)}
.tab:hover .tab-close,.tab.active .tab-close{opacity:1}

.breadcrumb{
  height:24px;flex-shrink:0;background:var(--bg);border-bottom:1px solid var(--border-dim);
  display:flex;align-items:center;padding:0 14px;gap:5px;font-size:12px;color:var(--text-dim);
  overflow:hidden;white-space:nowrap;
}
.breadcrumb .sep{opacity:.5}
.breadcrumb .cur{color:var(--text)}
.breadcrumb .sym{display:flex;align-items:center;gap:5px;color:var(--text)}

.editor-wrap{flex:1;overflow:hidden;display:flex;flex-direction:column;position:relative;min-height:0}
.editor{display:flex;flex:1;overflow:hidden;position:relative}

.gutter{
  width:56px;flex-shrink:0;background:var(--gutter-bg);overflow:hidden;padding:14px 0;
  user-select:none;position:relative;z-index:2;
}
.g-row{
  height:21px;display:flex;align-items:center;justify-content:flex-end;
  gap:3px;padding-right:6px;font-size:12.5px;
}
.g-row .n{color:var(--gutter-n);font-variant-numeric:tabular-nums}
.g-row.cur .n{color:var(--text-bright)}
.g-row .fold{
  width:14px;height:14px;display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);cursor:pointer;opacity:0;transition:opacity .1s;
}
.g-row .fold.on{opacity:1;color:var(--text)}
.editor:hover .g-row .fold.can{opacity:.75}
.g-row .fold:hover{color:var(--text-bright);opacity:1}

.scroll{flex:1;overflow:auto;position:relative;min-width:0}
.code{padding:14px 0;min-width:0;position:relative}
.code-line{
  height:21px;display:flex;align-items:center;padding:0 24px 0 20px;font-size:13px;
  white-space:pre;position:relative;cursor:text;
}
.code-line::before{
  content:"";position:absolute;left:20px;top:0;bottom:0;width:var(--ind,0px);pointer-events:none;
  background:repeating-linear-gradient(to right,var(--guide) 0 1px,transparent 1px 2ch);
}
.code-line:hover{background:var(--line-hl)}
.code-line.cur{background:var(--line-hl);box-shadow:inset 0 1px 0 var(--line-hl-b),inset 0 -1px 0 var(--line-hl-b)}
.code-line .txt{position:relative;z-index:1}
.fold-badge{
  margin-left:10px;background:var(--hover);border:1px solid var(--border);border-radius:3px;
  padding:0 5px;font-size:10px;color:var(--text-dim);cursor:pointer;z-index:1;
}
.fold-badge:hover{color:var(--text-bright)}

/* Sticky scroll */
.sticky{position:sticky;top:0;height:0;z-index:6;overflow:visible;pointer-events:none}
.sticky-inner{background:var(--bg);box-shadow:0 3px 6px -3px var(--shadow);border-bottom:1px solid var(--border-dim);pointer-events:auto}
.sticky-row{
  height:21px;display:flex;align-items:center;padding:0 24px 0 20px;font-size:13px;
  white-space:pre;cursor:pointer;
}
.sticky-row:hover{background:var(--hover)}

/* Tokens */
.t-keyword{color:var(--pink)} .t-fn{color:var(--purple)} .t-string{color:var(--yellow)}
.t-number{color:var(--green)} .t-comment{color:var(--comment);font-style:italic}
.t-type{color:var(--cyan)} .t-prop{color:var(--cyan)} .t-op{color:var(--pink)}
.t-punc{color:var(--text)} .t-var{color:var(--orange)} .t-plain{color:var(--text)} .t-tag{color:var(--green)}
.b0{color:var(--br1)} .b1{color:var(--br2)} .b2{color:var(--br3)}

@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.cursor{
  display:inline-block;width:2px;height:16px;background:var(--text-bright);
  vertical-align:text-bottom;animation:blink 1s step-end infinite;
}

/* Minimap */
.minimap{
  width:64px;flex-shrink:0;border-left:1px solid var(--border-dim);padding:14px 8px;
  overflow:hidden;position:relative;cursor:pointer;
}
.mm-line{height:2px;margin-bottom:1px;opacity:.5}
.mm-slider{
  position:absolute;left:0;right:0;background:var(--hover);border-radius:1px;pointer-events:none;
}
.minimap:hover .mm-slider{background:var(--line-hl-b);opacity:.7}

/* Rich panels */
.rich{border-top:1px solid var(--border-dim);margin:0 0 40px;padding:24px 20px}
.rich-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);margin-bottom:20px}
.rich h4{font-size:11px;font-weight:400;color:var(--text-dim);margin-bottom:14px;letter-spacing:1px}
.grid-skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 32px}
.grid-skills.wide{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 48px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.skill{margin-bottom:10px}
.skill-head{display:flex;justify-content:space-between;margin-bottom:4px;font-size:11px}
.skill-head .pct{color:var(--text-dim)}
.skill-track{height:3px;background:var(--border-dim);overflow:hidden}
.skill-fill{height:100%;width:0;opacity:.85;transition:width 1.2s cubic-bezier(.4,0,.2,1)}
.exp{border-left:2px solid var(--border);padding-left:14px;margin-bottom:10px}
.exp summary{cursor:pointer;user-select:none;list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.exp summary::-webkit-details-marker{display:none}
.exp .role{font-size:13px;font-weight:500}
.exp .period{color:var(--text-dim);font-size:11px}
.exp .org{color:var(--text-dim);font-size:11px;margin:2px 0 6px}
.exp .pt{font-size:12px;color:var(--text);line-height:1.7}
.exp .pt .dash{color:var(--text-dim);margin-right:6px}
.card{border:1px solid var(--border);background:var(--panel);padding:14px 16px;transition:border-color .15s}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.card-head .name{font-size:13px;font-weight:500}
.card-head .stack{font-size:10px;color:var(--text-dim)}
.card p{font-size:12px;color:var(--text-dim);line-height:1.6;margin-bottom:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border:1px solid;border-radius:2px;font-size:11px}
.contact-list{display:flex;flex-direction:column;gap:10px;max-width:420px}
.contact-row{display:flex;gap:16px;align-items:baseline;border-bottom:1px solid var(--border-dim);padding-bottom:8px}
.contact-row .k{font-size:11px;color:var(--text-dim);width:64px;flex-shrink:0}
.contact-row .v{font-size:13px;text-decoration:none;word-break:break-all}
.contact-row a.v:hover{text-decoration:underline}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.pulse{animation:pulse 2s ease-in-out infinite;display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor}

/* Panel (terminal etc) */
.resize-handle{height:1px;background:var(--border);cursor:ns-resize;flex-shrink:0;position:relative}
.resize-handle::after{content:"";position:absolute;left:0;right:0;top:-4px;bottom:-4px}
.resize-handle:hover{background:var(--blue)}
.panel{flex-shrink:0;background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
.panel-bar{
  height:35px;flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--border-dim);
  display:flex;align-items:center;padding:0 12px;gap:16px;overflow-x:auto;
}
.panel-tab{
  font-size:11px;letter-spacing:.5px;cursor:pointer;color:var(--text-dim);
  height:35px;display:flex;align-items:center;gap:6px;border-bottom:1px solid transparent;
  white-space:nowrap;background:none;border-top:0;border-left:0;border-right:0;
}
.panel-tab:hover{color:var(--text)}
.panel-tab.on{color:var(--text-bright);border-bottom-color:var(--text-bright)}

/* Datas reais: o "há quanto tempo" é calculado, não escrito na mão. */
function ago(iso){
  var days = Math.floor((Date.now() - new Date(iso + "T12:00:00").getTime()) / 86400000);
  if (days <= 0) return "hoje";
  if (days === 1) return "ontem";
  if (days < 7)   return days + " dias atrás";
  if (days < 30){ var w = Math.floor(days/7);  return w + (w > 1 ? " semanas" : " semana") + " atrás"; }
  if (days < 365){ var m = Math.floor(days/30); return m + (m > 1 ? " meses" : " mês") + " atrás"; }
  var y = Math.floor(days/365);
  return y + (y > 1 ? " anos" : " ano") + " atrás";
}

/* Análise: indentação, brackets, folding */
var ANALYSIS = {};

function lineText(toks){
  var s = "";
  for (var i=0;i<toks.length;i++) s += toks[i].t;
  return s;
}

function analyze(fid){
  if (ANALYSIS[fid]) return ANALYSIS[fid];
  var lines = FILES[fid].lines;
  var texts = lines.map(lineText);
  var isMd = fid.slice(-3) === ".md";

  /* indentação (linhas vazias herdam do bloco) */
  var raw = texts.map(function(t){ return t.trim() === "" ? -1 : t.match(/^ */)[0].length; });
  var indent = raw.slice();
  for (var i=0;i<indent.length;i++){
    if (indent[i] !== -1) continue;
    var a=-1,b=-1,j;
    for (j=i-1;j>=0;j--) if (raw[j]!==-1){ a=raw[j]; break; }
    for (j=i+1;j<raw.length;j++) if (raw[j]!==-1){ b=raw[j]; break; }
    indent[i] = (a<0||b<0) ? 0 : Math.min(a,b);
  }

  /* bracket pair colorization (fora de string/comentário) */
  var depth = 0;
  var html = lines.map(function(toks){
    var out = "";
    for (var t=0;t<toks.length;t++){
      var tok = toks[t];
      if (isMd || tok.k === "string" || tok.k === "comment"){
        out += '<span class="t-'+tok.k+'">'+esc(tok.t)+'</span>';
        continue;
      }
      var buf = "", inner = "";
      for (var c=0;c<tok.t.length;c++){
        var ch = tok.t[c];
        if (ch==="{"||ch==="["||ch==="("){
          inner += esc(buf); buf = "";
          inner += '<span class="b'+(depth%3)+'">'+ch+'</span>';
          depth++;
        } else if (ch==="}"||ch==="]"||ch===")"){
          inner += esc(buf); buf = "";
          depth = Math.max(0, depth-1);
          inner += '<span class="b'+(depth%3)+'">'+ch+'</span>';
        } else buf += ch;
      }
      inner += esc(buf);
      out += '<span class="t-'+tok.k+'">'+inner+'</span>';
    }
    return out;
  });

  /* regiões dobráveis */
  var folds = [];
  if (isMd){
    var heads = [];
    texts.forEach(function(t,i){
      var m = t.match(/^(#+)\s/);
      if (m) heads.push({ line:i, level:m[1].length });
    });
    heads.forEach(function(h,i){
      var end = texts.length - 1;
      for (var k=i+1;k<heads.length;k++){
        if (heads[k].level <= h.level){ end = heads[k].line - 1; break; }
      }
      while (end > h.line && texts[end].trim() === "") end--;
      if (end > h.line) folds.push({ start:h.line, end:end, label:texts[h.line].trim() });
    });
  }
  /* indentação (vale para todos, inclusive listas em md) */
  for (var s=0;s<texts.length;s++){
    if (raw[s] === -1) continue;
    var nxt = -1;
    for (var n=s+1;n<texts.length;n++) if (raw[n]!==-1){ nxt = n; break; }
    if (nxt === -1 || raw[nxt] <= raw[s]) continue;
    var end2 = s;
    for (var e=s+1;e<texts.length;e++){
      if (raw[e] === -1) continue;
      if (raw[e] > raw[s]) end2 = e; else break;
    }
    if (end2 > s && !folds.some(function(f){ return f.start === s; }))
      folds.push({ start:s, end:end2, label:texts[s].trim() });
  }
  folds.sort(function(a,b){ return a.start - b.start; });

  /* símbolos (outline / breadcrumb) */
  var syms = [];
  texts.forEach(function(t,i){
    var m;
    if ((m = t.match(/^\s*(#+)\s+(.+)$/)))                                   { syms.push({line:i,label:m[2].trim(),kind:"h"}); return; }
    if ((m = t.match(/^\s*(?:export default\s+)?(?:async\s+)?function\s+([\w$]+)/))) { syms.push({line:i,label:m[1],kind:"fn"}); return; }
    if ((m = t.match(/^\s*(?:const|let|var)\s+([\w$]+)/)))                    { syms.push({line:i,label:m[1],kind:"var"}); return; }
    if ((m = t.match(/^\s*"name"\s*:\s*"([^"]+)"/)))                         { syms.push({line:i,label:m[1],kind:"obj"}); return; }
    if ((m = t.match(/^\s{0,3}"([\w-]+)"\s*:/)))                             { syms.push({line:i,label:m[1],kind:"prop"}); return; }
  });

  return (ANALYSIS[fid] = { texts:texts, indent:indent, html:html, folds:folds, syms:syms });
}

function revealLine(fid, line){
  if (state.active !== fid) openFile(fid, true);
  if (line < 0){ /* resultado da rendered view: rola até o painel */
    el.scroll.scrollTop = Math.max(0, el.rich.offsetTop - 12);
    onScroll();
    return;
  }
  var arr = foldedOf(fid), a = analyze(fid), changed = false;
  a.folds.forEach(function(f){
    if (f.start < line && f.end >= line){
      var k = arr.indexOf(f.start);
      if (k >= 0){ arr.splice(k,1); changed = true; }
    }
  });
  if (changed) renderEditor();
  var vis = visibleLines(fid), idx = vis.indexOf(line);
  if (idx < 0) idx = 0;
  el.scroll.scrollTop = Math.max(0, lineTopAt(idx) - el.scroll.clientHeight/3);
  setCursor(line, 1);
  onScroll();
}

/* Sticky scroll + breadcrumb + minimap */

/* Posição das linhas medida no DOM: em telas estreitas o texto quebra
   e a altura deixa de ser fixa em 21px. */
function lineTopAt(vIdx){
  var n = el.code.children[vIdx];
  return n ? n.offsetTop : 14 + vIdx * 21;
}
function visIndexAt(top){
  var kids = el.code.children;
  if (!kids.length) return 0;
  var lo = 0, hi = kids.length - 1;
  while (lo < hi){
    var mid = (lo + hi + 1) >> 1;
    if (kids[mid].offsetTop <= top) lo = mid; else hi = mid - 1;
  }
  return lo;
}

function onScroll(){
  var fid = state.active, a = analyze(fid), vis = visibleLines(fid);
  var top = el.scroll.scrollTop;
  el.gutter.scrollTop = top;

  var idx = visIndexAt(top);
  var line = vis[Math.min(idx, vis.length-1)];
  if (line === undefined) line = 0;

  var stack = a.folds.filter(function(f){ return f.start < line && f.end >= line; });
  stack.sort(function(x,y){ return x.start - y.start; });
  stack = stack.slice(0,3);

  if (top > 6 && stack.length){
    el.stickyInner.innerHTML = stack.map(function(f){
      return '<div class="sticky-row" data-goto="'+f.start+'" role="button" tabindex="0">'+a.html[f.start]+'</div>';
    }).join("");
    el.sticky.hidden = false;
  } else {
    el.stickyInner.innerHTML = "";
    el.sticky.hidden = true;
  }

  /* breadcrumb com símbolo */
  var symbol = "";
  for (var i=0;i<a.syms.length;i++){
    if (a.syms[i].line <= line) symbol = a.syms[i].label; else break;
  }
  var crumb = '<span>igordev-exe</span><span class="sep">'+ICO.chevR+'</span>'+
              '<span class="cur">'+esc(fid)+'</span>';
  if (symbol) crumb += '<span class="sep">'+ICO.chevR+'</span><span class="sym">'+ICO.sym+esc(symbol)+'</span>';
  el.breadcrumb.innerHTML = crumb;

  /* minimap */
  updateMinimap();
}

function updateMinimap(){
  if (!el.mmSlider || el.minimap.offsetParent === null) return;
  var contentH = el.scroll.scrollHeight, viewH = el.scroll.clientHeight;
  var mmH = el.minimap.clientHeight - 28;
  var lines = visibleLines(state.active).length;
  var mmContent = Math.min(lines*3, mmH);
  if (contentH <= viewH){ el.mmSlider.style.height = "0"; return; }
  var h = Math.max(18, (viewH/contentH) * mmContent);
  var t = 14 + (el.scroll.scrollTop/contentH) * mmContent;
  el.mmSlider.style.top = t + "px";
  el.mmSlider.style.height = h + "px";
}

function minimapJump(clientY){
  var r = el.minimap.getBoundingClientRect();
  var mmH = el.minimap.clientHeight - 28;
  var lines = visibleLines(state.active).length;
  var mmContent = Math.min(lines*3, mmH);
  var ratio = (clientY - r.top - 14) / mmContent;
  ratio = Math.max(0, Math.min(1, ratio));
  el.scroll.scrollTop = ratio * el.scroll.scrollHeight - el.scroll.clientHeight/2;
}

var skillObserver = null;
function armSkillBars(){
  var fills = el.rich.querySelectorAll(".skill-fill");
  if (!fills.length) return;
  if (!("IntersectionObserver" in window)){
    Array.prototype.forEach.call(fills, function(f){ f.style.width = f.dataset.lvl + "%"; });
    return;
  }
  if (skillObserver) skillObserver.disconnect();
  skillObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (e.isIntersecting){ e.target.style.width = e.target.dataset.lvl + "%"; skillObserver.unobserve(e.target); }
    });
  }, { threshold:0.2, root:el.scroll });
  Array.prototype.forEach.call(fills, function(f){ skillObserver.observe(f); });
}

function openFile(id, preview){
  if (!FILES[id]) return;
  var existing = null;
  state.tabs.forEach(function(t){ if (t.id === id) existing = t; });
  if (existing){
    if (!preview) existing.preview = false;
  } else if (preview){
    var prev = null;
    state.tabs.forEach(function(t){ if (t.preview) prev = t; });
    if (prev) prev.id = id; else state.tabs.push({ id:id, preview:true });
  } else {
    state.tabs.push({ id:id, preview:false });
  }
  state.active = id;
  if (isNarrow()) state.sideOpen = false;
  renderTabs(); renderEditor(); renderSidebar(); renderActivity(); renderChrome();
}

  if (!next.length){ state.tabs = [{ id:"readme.md", preview:false }]; state.active = "readme.md"; }
  else {

function snippet(text, idx, len){
  var start = Math.max(0, idx-14);
  var frag = text.slice(start, start+64);
  var rel = idx - start;
  return (start?"…":"")+esc(frag.slice(0,rel))+'<mark>'+esc(frag.substr(rel,len))+'</mark>'+esc(frag.slice(rel+len));
}
function searchAll(q){
  var out = [], ql = norm(q);
  if (!ql) return out;
  TREE_FILES.forEach(function(fid){
    var a = analyze(fid), hits = [];
    a.texts.forEach(function(t,i){
      var idx = norm(t).indexOf(ql);
      if (idx >= 0) hits.push({ line:i, html:snippet(t, idx, q.length) });
    });
    /* o que só existe na rendered view (experiências, projetos, contatos) */
    (RICH_INDEX[fid] || []).forEach(function(t){
      var idx = norm(t).indexOf(ql);
      if (idx >= 0) hits.push({ line:-1, html:snippet(t, idx, q.length) });
    });
    if (hits.length) out.push({ fid:fid, hits:hits.slice(0,20) });
  });
  return out;
}

var qi = { open:false, sel:0, items:[] };

function fuzzy(q, s){
  if (!q) return { score:0, idx:[] };
  var ql = q.toLowerCase(), sl = s.toLowerCase(), i = 0, idx = [], score = 0, prev = -2;
  for (var j=0; j<sl.length && i<ql.length; j++){
    if (sl[j] === ql[i]){
      idx.push(j);
      score += (j === prev+1 ? 4 : 1) + (j === 0 ? 3 : 0);
      prev = j; i++;
    }
  }
  return i === ql.length ? { score:score, idx:idx } : null;
}
function mark(s, idx){
  var out = "", set = {};
  idx.forEach(function(i){ set[i] = 1; });
  for (var i=0;i<s.length;i++) out += set[i] ? "<b>"+esc(s[i])+"</b>" : esc(s[i]);
  return out;
}

function qiItems(raw){
  var v = raw || "";
  if (v.charAt(0) === ">"){
    var q = v.slice(1).trim();
    return CMDS.map(function(c){
      var full = (c.cat ? c.cat + ": " : "") + c.label;
      var m = fuzzy(q, full);
      return m ? { html:mark(full, m.idx), key:c.key, score:m.score, act:function(){ c.run(); } } : null;
    }).filter(Boolean).sort(function(a,b){ return b.score - a.score; }).slice(0,40);
  }
  if (v.charAt(0) === ":"){
    var n = parseInt(v.slice(1), 10);
    var max = FILES[state.active].lines.length;
    if (!n || n < 1 || n > max)
      return [{ html:"Ir para linha entre 1 e "+max+" em "+esc(state.active), key:"", score:0, act:null }];
    return [{ html:"Ir para linha <b>"+n+"</b> em "+esc(state.active), key:"Enter", score:0,
              act:function(){ revealLine(state.active, n-1); } }];
  }
  return TREE_FILES.map(function(f){
    var m = fuzzy(v.trim(), f);
    return m ? { html:fileIcon(f,15)+'<span class="qi-lbl">'+mark(f, m.idx)+'</span><span class="qi-sub">'+FILES[f].lang+'</span>',
                 key:"", score:m.score, act:function(){ openFile(f, true); } } : null;
  }).filter(Boolean).sort(function(a,b){ return b.score - a.score; });
}

function openQuick(prefix){
  closeQuick();
  qi.open = true; qi.sel = 0;
  var o = document.createElement("div");
  o.className = "qi-overlay"; o.id = "qi-overlay";
  o.innerHTML = '<div class="qi"><input class="qi-input" id="qi-input" spellcheck="false" autocomplete="off" '+
                'placeholder="Digite &quot;&gt;&quot; para comandos, &quot;:&quot; para linha" value="'+esc(prefix)+'">'+
                '<div class="qi-list" id="qi-list"></div></div>';
  document.body.appendChild(o);
  var input = $("qi-input");
  input.focus();
  input.setSelectionRange(prefix.length, prefix.length);
  qiRender();
  input.addEventListener("input", function(){ qi.sel = 0; qiRender(); });
  input.addEventListener("keydown", qiKey);
  o.addEventListener("mousedown", function(e){ if (e.target === o) closeQuick(); });
  $("qi-list").addEventListener("click", function(e){
    var it = e.target.closest("[data-i]");
    if (it){ qi.sel = +it.dataset.i; qiAccept(); }
  });
}
function qiRender(){
  var v = $("qi-input").value;
  qi.items = qiItems(v);
  var list = $("qi-list");
  if (!qi.items.length){ list.innerHTML = '<div class="qi-empty">Nenhum resultado</div>'; return; }
  if (qi.sel >= qi.items.length) qi.sel = qi.items.length - 1;
  list.innerHTML = qi.items.map(function(it,i){
    return '<div class="qi-item'+(i===qi.sel?" sel":"")+'" data-i="'+i+'" role="button" tabindex="0">'+it.html+
           (it.key?'<span class="qi-key">'+it.key+'</span>':'')+'</div>';
  }).join("");
  var sel = list.querySelector(".sel");
  if (sel && sel.scrollIntoView) sel.scrollIntoView({ block:"nearest" });
}
function qiKey(e){
  if (e.key === "Escape"){ closeQuick(); return; }
  if (e.key === "ArrowDown"){ qi.sel = Math.min(qi.sel+1, qi.items.length-1); qiRender(); e.preventDefault(); return; }
  if (e.key === "ArrowUp"){ qi.sel = Math.max(qi.sel-1, 0); qiRender(); e.preventDefault(); return; }
  if (e.key === "Enter"){ qiAccept(); e.preventDefault(); }
}
function qiAccept(){
  var it = qi.items[qi.sel];
  if (!it || !it.act) return;
  closeQuick();
  it.act();
}
function closeQuick(){
  var o = $("qi-overlay");
  if (o) o.parentNode.removeChild(o);
  qi.open = false;
}

function push(){
  for (var i=0;i<arguments.length;i++) termLines.push(arguments[i]);

function runTerm(raw){
  var cmd = raw.trim().toLowerCase();
  push({ text:"~/igordev-exe $ "+raw, color:"var(--text-dim)" });
  if (raw.trim()) cmdHist.unshift(raw);
  histIdx = -1;

  if (!cmd){ push({ text:"" }); return; }
  if (cmd === "clear"){ termLines = []; paintTerm(); return; }
  if (cmd === "help"){ push.apply(null, HELP_LINES.concat([{ text:"" }])); return; }

  if (cmd === "whoami"){
    push({ text:"Igor Alves", color:"var(--cyan)" },
         { text:"Estudante de Engenharia de Software — UnB/FGA" },
         { text:"Brasília, DF · Foco em front-end e prototipação" }, { text:"" });
    return;
  }
  if (cmd === "status"){
    push({ text:"● open to internship opportunities", color:"var(--green)" },
         { text:"  Front-end developer · Fullstack · UX/UI", color:"var(--text-dim)" },
         { text:"  igoralvesrodrigues12@gmail.com", color:"var(--text-dim)" }, { text:"" });
    return;
  }
  if (cmd === "ls" || cmd.indexOf("ls ") === 0){
    push({ text:"about.md   projects.json   skills.ts   contact.js   readme.md", color:"var(--yellow)" }, { text:"" });
    return;
  }
  if (/^theme(\s|$)/.test(cmd)){
    var th = cmd.split(" ")[1];
    if (THEMES.some(function(t){ return t.id === th; })){
      setTheme(th);
      push({ text:"→ tema alterado para "+th, color:"var(--text-dim)" }, { text:"" });
    } else {
      push({ text:"uso: theme dark | light | monokai", color:"var(--pink)" }, { text:"" });
    }
    return;
  }
  if (/^grep(\s|$)/.test(cmd)){
    var term = raw.trim().slice(4).trim();
    if (!term){
      push({ text:"uso: grep <termo>", color:"var(--pink)" }, { text:"" });
      return;
    }
    var res = searchAll(term), n = 0;
    res.forEach(function(r){
      r.hits.forEach(function(h){
        n++;
        var where = h.line < 0 ? "rendered" : String(h.line + 1);
        var text = h.line < 0 ? h.html.replace(/<[^>]+>/g, "")
                              : analyze(r.fid).texts[h.line].trim();
        push({ text:r.fid+":"+where+"  "+text.slice(0,70) });
      });
    });
    if (!n) push({ text:"grep: nenhum resultado para \""+term+"\"", color:"var(--pink)" });
    else push({ text:n+" resultado(s)", color:"var(--text-dim)" });
    push({ text:"" });
    state.query = term; if (state.view === "search") renderSidebar();
    return;
  }
  if (/^(cat|open)(\s|$)/.test(cmd)){
    var arg = cmd.split(" ").slice(1).join(" ").trim();
    if (!arg){
      push({ text:"uso: "+cmd.split(" ")[0]+" <arquivo>   (ls lista os disponíveis)", color:"var(--pink)" }, { text:"" });
      return;
    }
    var fid = FILE_MAP[arg];
    if (fid){ push({ text:"→ Opening "+fid, color:"var(--text-dim)" }, { text:"" }); openFile(fid, false); }
    else push({ text:"bash: "+arg+": No such file", color:"var(--pink)" }, { text:"" });
    return;
  }
  var direct = FILE_MAP[cmd];
  if (direct){ push({ text:"→ Opening "+direct, color:"var(--text-dim)" }, { text:"" }); openFile(direct, false); return; }

  push({ text:"bash: command not found: "+raw, color:"var(--pink)" },
       { text:'Try "help" for a list of commands.', color:"var(--text-dim)" }, { text:"" });
}

}

/* Eventos */
document.addEventListener("click", function(e){
  if ($("btn-menu") && $("btn-menu").contains(e.target)){ openMobileMenu($("btn-menu")); return; }

  var cmdBtn = e.target.closest("[data-cmd]");
  if (cmdBtn){ runCmd(cmdBtn.dataset.cmd); return; }

  var menuBtn = e.target.closest("[data-menu]");
  if (menuBtn){ openMenu(+menuBtn.dataset.menu, menuBtn); return; }

  var ddCmd = e.target.closest("[data-runcmd]");
  if (ddCmd){ closeMenus(); runCmd(ddCmd.dataset.runcmd); return; }

  var ddFile = e.target.closest("[data-openfile]");
  if (ddFile){ closeMenus(); openFile(ddFile.dataset.openfile, false); return; }

  if ($("btn-gear") && $("btn-gear").contains(e.target)){ openThemeMenu($("btn-gear")); return; }

  if (!e.target.closest("#dropdown")) closeMenus();
});

el.activity.addEventListener("click", function(e){
  var b = e.target.closest("[data-view]");
  if (b) setView(b.dataset.view);
});

el.sideScroll.addEventListener("click", function(e){
  var tog = e.target.closest("[data-toggle]");
  if (tog){
    if (tog.dataset.toggle === "tree") state.treeOpen = !state.treeOpen;
    else state.outlineOpen = !state.outlineOpen;
    renderSidebar(); return;
  }
  var goTo = e.target.closest("[data-goto]");
  if (goTo){ revealLine(state.active, +goTo.dataset.goto); return; }
  var openLine = e.target.closest("[data-open]");
  if (openLine){ revealLine(openLine.dataset.open, +openLine.dataset.line); return; }
  var f = e.target.closest("[data-file]");
  if (f) openFile(f.dataset.file, true);
});
el.sideScroll.addEventListener("dblclick", function(e){
  var f = e.target.closest("[data-file]");
  if (f) pinTab(f.dataset.file);
});
el.sideScroll.addEventListener("input", function(e){
  if (e.target.id === "search-input"){
    state.query = e.target.value;
    var pos = e.target.selectionStart;
    renderSidebar();
    var i = $("search-input");
    if (i){ i.focus(); i.setSelectionRange(pos, pos); }
  }
});

el.tabs.addEventListener("click", function(e){
  var c = e.target.closest("[data-close]");
  if (c){ e.stopPropagation(); closeTab(c.dataset.close); return; }
  var t = e.target.closest("[data-tab]");
  if (t){ state.active = t.dataset.tab; renderTabs(); renderEditor(); renderSidebar(); }
});
el.tabs.addEventListener("dblclick", function(e){
  var t = e.target.closest("[data-tab]");
  if (t) pinTab(t.dataset.tab);
});

el.gutter.addEventListener("click", function(e){
  var f = e.target.closest("[data-fold]");
  if (f && f.classList.contains("can")){ toggleFold(+f.dataset.fold); return; }
  var r = e.target.closest("[data-line]");
  if (r) setCursor(+r.dataset.line, 1);
});

el.code.addEventListener("click", function(e){
  var badge = e.target.closest(".fold-badge");
  if (badge){ toggleFold(+badge.dataset.fold); return; }
  var line = e.target.closest(".code-line");
  if (!line) return;
  var txt = line.querySelector(".txt");
  var r = txt.getBoundingClientRect();
  var len = analyze(state.active).texts[+line.dataset.line].length;
  var col = Math.round((e.clientX - r.left) / charW) + 1;
  setCursor(+line.dataset.line, Math.max(1, Math.min(col, len + 1)));
});

el.stickyInner.addEventListener("click", function(e){
  var r = e.target.closest("[data-goto]");
  if (r) revealLine(state.active, +r.dataset.goto);
});

el.rich.addEventListener("mouseover", function(e){
  var c = e.target.closest(".card"); if (c) c.style.borderColor = c.dataset.hover;
});
el.rich.addEventListener("mouseout", function(e){
  var c = e.target.closest(".card"); if (c) c.style.borderColor = "var(--border)";
});

el.scroll.addEventListener("scroll", onScroll, { passive:true });

el.minimap.addEventListener("mousedown", function(e){
  minimapJump(e.clientY);
  function mv(ev){ minimapJump(ev.clientY); }
  function up(){ window.removeEventListener("mousemove", mv); window.removeEventListener("mouseup", up); }
  window.addEventListener("mousemove", mv); window.addEventListener("mouseup", up);
});

el.backdrop.addEventListener("click", function(){ state.sideOpen = false; renderActivity(); renderChrome(); });

el.panelBar.addEventListener("click", function(e){
  var t = e.target.closest("[data-ptab]");
  if (t){ setPanel(t.dataset.ptab); return; }
  if ($("panel-close") && $("panel-close").contains(e.target)){ state.panelOpen = false; renderChrome(); return; }
  if ($("panel-clear") && $("panel-clear").contains(e.target)){
    if (state.panelTab === "terminal"){ termLines = []; paintTerm(); }
    else if (state.panelTab === "debug"){ dbgLines = []; paintDebug(); }
  }
});
el.panelOpenBtn.addEventListener("click", function(){ setPanel(state.panelTab); });

el.termBody.addEventListener("click", function(e){
  if (!window.getSelection().toString() && e.target.tagName !== "A") el.termInput.focus();
});
el.termInput.addEventListener("keydown", function(e){
  if (e.key === "Enter"){ runTerm(el.termInput.value); el.termInput.value = ""; syncCaret(); return; }
  if (e.key === "ArrowUp"){
    var n = Math.min(histIdx+1, cmdHist.length-1);
    histIdx = n; el.termInput.value = cmdHist[n] || ""; e.preventDefault(); setTimeout(syncCaret,0);
  }
  if (e.key === "ArrowDown"){
    var m = Math.max(histIdx-1, -1);
    histIdx = m; el.termInput.value = m === -1 ? "" : (cmdHist[m] || ""); e.preventDefault(); setTimeout(syncCaret,0);
  }
  setTimeout(syncCaret, 0);
});
["input","click","keyup","focus","blur","select"].forEach(function(ev){
  el.termInput.addEventListener(ev, syncCaret);
});

/* Redimensionar painel (vertical) */
function dragPanel(clientY){
  var startY = clientY, startH = state.panelH, on = true;
  function move(y){ if (!on) return; state.panelH = Math.max(80, Math.min(560, startH + startY - y)); el.panel.style.height = state.panelH+"px"; updateMinimap(); }
  function mm(ev){ move(ev.clientY); }
  function tm(ev){ move(ev.touches[0].clientY); ev.preventDefault(); }
  function stop(){
    on = false; document.body.style.userSelect = "";
    window.removeEventListener("mousemove", mm); window.removeEventListener("mouseup", stop);
    window.removeEventListener("touchmove", tm); window.removeEventListener("touchend", stop);
  }
  document.body.style.userSelect = "none";
  window.addEventListener("mousemove", mm); window.addEventListener("mouseup", stop);
  window.addEventListener("touchmove", tm, { passive:false }); window.addEventListener("touchend", stop);
}
el.resize.addEventListener("mousedown", function(e){ e.preventDefault(); dragPanel(e.clientY); });
el.resize.addEventListener("touchstart", function(e){ dragPanel(e.touches[0].clientY); }, { passive:true });

/* Redimensionar sidebar (horizontal) */
el.sideResize.addEventListener("mousedown", function(e){
  e.preventDefault();
  var startX = e.clientX, startW = state.sideW, on = true;
  function mm(ev){
    if (!on) return;
    state.sideW = Math.max(160, Math.min(440, startW + ev.clientX - startX));
    document.documentElement.style.setProperty("--sideW", state.sideW + "px");
    updateMinimap();
  }
  function stop(){ on = false; document.body.style.userSelect = ""; window.removeEventListener("mousemove", mm); window.removeEventListener("mouseup", stop); }
  document.body.style.userSelect = "none";
  window.addEventListener("mousemove", mm); window.addEventListener("mouseup", stop);
});

/* Enter e Espaço ativam as linhas clicáveis: árvore, outline, busca, menus e abas. */
document.addEventListener("keydown", function(e){
  if (e.key !== "Enter" && e.key !== " ") return;
  var t = e.target;
  if (!t || !t.getAttribute) return;
  var role = t.getAttribute("role");
  if (role !== "button" && role !== "tab") return;
  e.preventDefault();
  t.click();
});

/* Atalhos globais */
document.addEventListener("keydown", function(e){
  if (e.key === "Escape"){ closeMenus(); if (qi.open) closeQuick(); return; }
  if (qi.open) return;
  var mod = e.ctrlKey || e.metaKey;
  if (!mod) return;
  var k = e.key.toLowerCase();
  if (k === "p"){ e.preventDefault(); openQuick(e.shiftKey ? ">" : ""); return; }
  if (e.shiftKey && k === "e"){ e.preventDefault(); runCmd("view.explorer"); return; }
  if (e.shiftKey && k === "f"){ e.preventDefault(); runCmd("view.search"); return; }
  if (e.shiftKey && k === "g"){ e.preventDefault(); runCmd("view.scm"); return; }
  if (e.shiftKey && k === "x"){ e.preventDefault(); runCmd("view.extensions"); return; }
  if (e.shiftKey && k === "m"){ e.preventDefault(); runCmd("view.problems"); return; }
  if (e.shiftKey && k === "u"){ e.preventDefault(); runCmd("view.output"); return; }
  if (e.shiftKey && k === "y"){ e.preventDefault(); runCmd("view.debug"); return; }
  if (k === "g"){ e.preventDefault(); openQuick(":"); return; }
  if (k === "b"){ e.preventDefault(); runCmd("view.toggleSidebar"); return; }
  if (e.key === "`"){ e.preventDefault(); togglePanel(); return; }
});

var wasNarrow = isNarrow();
window.addEventListener("resize", function(){
  var now = isNarrow();
  if (now !== wasNarrow){
    wasNarrow = now;
    closeMenus();
    if (now){ state.sideOpen = false; state.panelH = Math.min(state.panelH, 132); }
    renderActivity(); renderChrome(); renderEditor();
    return;
  }
  if (now) state.panelH = Math.min(state.panelH, Math.round(window.innerHeight * 0.5));
  renderChrome(); onScroll();
});

/* Boot */
measureChar();
renderMenubar();
renderActivity();
renderSidebar();
renderTabs();
renderPanelBar();
setPanel("terminal");
renderEditor();
renderChrome();
paintTerm();
syncCaret();
booting = false;
console.log("igor-portfolio pronto — Ctrl+Shift+P para o command palette");
})();
